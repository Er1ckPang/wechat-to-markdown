<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保存记录 · 在线文章本地保存</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="shell"><header><a href="/" class="brand"><span class="brand-mark">文</span><span>在线文章本地保存<small>wx2md Local</small></span></a><div class="header-actions"><a href="/">返回首页</a><a href="/guide.html" target="_blank">使用指南 ↗</a></div></header>
<main><section class="hero records-hero"><p class="eyebrow">这台电脑的文章库</p><h1>保存记录</h1><p class="intro">查找已保存的文章，查看失效原因或重新保存。筛选后最多查看 10000 条记录；完整记录持续保存在本机。</p><div class="service"><span class="dot"></span><span id="service-text">正在读取本地记录…</span></div></section>
<form id="filters" class="card record-filters"><label class="filter-search">搜索标题、公众号 / 作者或链接<input name="q" maxlength="300" type="search" placeholder="输入关键词"></label>
<label>记录分类<select name="group"><option value="">全部记录</option><option value="saved">已生成文件</option><option value="active">当前活跃任务</option><option value="attention">需要关注</option></select></label>
<label>保存状态<select name="status"><option value="">所有状态</option></select></label><label>网站<select name="site"><option value="">所有网站</option></select></label><label>公众号 / 作者<select name="account"><option value="">全部公众号 / 作者</option></select></label>
<label>消息来源<select name="source"><option value="">所有来源</option></select></label><label>入队时间 · 从<input name="from" type="date"></label><label>至（含当天）<input name="to" type="date"></label>
<label>排序<select name="sort"><option value="newest">最新入队在前</option><option value="oldest">最早入队在前</option><option value="updated">最近更新在前</option><option value="title">按标题排序</option></select></label><label>每页条数<select name="pageSize"><option value="20">20 条</option><option value="50" selected>50 条</option><option value="100">100 条</option></select></label>
<div class="filter-actions"><button type="submit" class="primary">筛选记录</button><button type="button" id="clear-filters" class="quiet">清空筛选</button><button type="button" id="reload" class="quiet">刷新</button></div></form>
<section class="history records-history" aria-label="筛选结果"><div class="history-heading"><h2>查询结果 <span id="job-count">0</span></h2><span id="result-summary" role="status"></span></div><p id="query-note" class="note"></p><p id="records-error" class="error-text" role="alert" hidden></p><div id="jobs" aria-busy="true"><div class="empty">正在读取保存记录…</div></div>
<nav class="pagination" aria-label="记录分页"><button id="prev" type="button">上一页</button><span id="page-label"></span><button id="next" type="button">下一页</button><form id="jump-form"><label for="jump-page">跳转到</label><input id="jump-page" type="number" min="1" value="1"><button type="submit">前往</button></form></nav></section></main>
<footer><span>日期筛选使用北京时间（入队日期）。</span><span id="service-version"></span></footer></div><div id="toast" role="status" hidden></div><script type="module" src="/records.js"></script></body></html>
