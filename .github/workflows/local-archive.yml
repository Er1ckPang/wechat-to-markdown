name: Local archive cross-platform

on:
  push:
    branches: [dev_p, 'feat/**']
    paths: ['local-archive/**', '.gitattributes', '.github/workflows/local-archive.yml']
  pull_request:
    paths: ['local-archive/**', '.gitattributes', '.github/workflows/local-archive.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: local-archive
        shell: bash
    env:
      WX2MD_BROWSER: chromium
      WX2MD_NO_PAUSE: '1'
      WX2MD_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/playwright/cli.js install chromium
      - name: Check shell scripts
        run: |
          for file in *.command scripts/*.sh; do bash -n "$file"; done
      - name: Mac first-time installation
        if: runner.os == 'macOS'
        run: bash install-mac.command
      - run: pnpm build
      - run: pnpm test
      - name: Mac background lifecycle
        if: runner.os == 'macOS'
        run: |
          bash doctor-mac.command
          bash start-mac.command
          bash start-mac.command
          node scripts/check-running.mjs
          bash stop-mac.command
          bash stop-mac.command
          if node scripts/check-running.mjs; then exit 1; else test "$?" -eq 2; fi
